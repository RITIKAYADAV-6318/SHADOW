<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 12px; }
      button { padding: 8px 12px; margin: 4px 4px 4px 0; }
      textarea { width: 100%; height: 90px; }
      #log { font-size: 12px; white-space: pre-wrap; background: #f4f4f4; padding: 8px; height: 160px; overflow: auto; }
    </style>
  </head>
  <body>
    <h3>Mentor voice spike</h3>
    <button id="mic">🎙 Start listening</button>
    <button id="perm">Grant mic (opens tab)</button>
    <button id="tts">Test chrome.tts</button>
    <button id="synth">Test speechSynthesis</button>
    <button id="bgtts">TTS from background (then close panel)</button>
    <button id="popup">Open as popup window</button>
    <p>Transcript (this box also works for typing or Wispr dictation):</p>
    <textarea id="text" placeholder="Say something..."></textarea>
    <p>Log:</p>
    <div id="log"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
